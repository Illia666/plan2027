<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>План роботи на 2027 рік — дашборд | Держдітслужба</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#content">Перейти до основного контенту</a>

  <div class="topbar">
    <div class="wrap topbar-row">
      <span id="srcBadge" class="badge">Завантаження…</span>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#" id="brand" title="На початок">
        <img src="logo.svg" alt="DSU" class="brand-logo">
        <span class="brand-text">
          <strong>Державна служба України у справах дітей</strong>
          <small>План роботи на 2027 рік</small>
        </span>
      </a>

      <div class="header-actions">
        <button class="btn btn-primary" id="btnRefresh" type="button">↻ Оновити дані</button>
        <button class="btn btn-outline" id="btnExport" type="button">⬇ Експорт CSV</button>
        <button class="btn btn-outline" id="btnPrint" type="button">🖨 Друк сторінки</button>
        <button class="btn btn-primary" id="btnReport" type="button">📄 Звіт для друку</button>

        <div class="a11y" role="group" aria-label="Налаштування доступності">
          <button class="a11y-btn a1" data-font="0" type="button" title="Базовий розмір тексту" aria-label="Базовий розмір тексту">A</button>
          <button class="a11y-btn a2" data-font="1" type="button" title="Середній розмір тексту" aria-label="Середній розмір тексту">A</button>
          <button class="a11y-btn a3" data-font="2" type="button" title="Великий розмір тексту" aria-label="Великий розмір тексту">A</button>
          <button class="a11y-btn bw" id="btnBW" type="button" title="Чорно-біла версія" aria-pressed="false">Ч/Б</button>
        </div>
      </div>
    </div>
  </header>

  <main id="content" class="wrap">
    <section class="hero">
      <h1>План роботи Державної служби України у справах дітей на 2027 рік</h1>
      <p class="muted" id="heroSub">Завантаження даних…</p>
    </section>

    <section class="kpis" id="kpis" aria-label="Ключові показники"></section>

    <section class="panel filters" aria-label="Фільтри">
      <div class="field grow">
        <label for="fSearch">Пошук</label>
        <input id="fSearch" type="search" placeholder="Завдання, виконавець, індикатор, результат…">
      </div>
      <div class="field">
        <label for="fPriority">Пріоритетний напрям</label>
        <select id="fPriority"></select>
      </div>
      <div class="field">
        <label for="fSection">Розділ</label>
        <select id="fSection"></select>
      </div>
      <div class="field">
        <label for="fResp">Відповідальні</label>
        <select id="fResp"></select>
      </div>
      <div class="field">
        <label for="fTerm">Термін</label>
        <select id="fTerm"></select>
      </div>
      <div class="field">
        <button class="btn btn-ghost" id="btnReset" type="button">✕ Скинути фільтри</button>
      </div>
    </section>

    <div class="chips" id="chips" aria-live="polite"></div>

    <section class="charts" aria-label="Графіки">
      <article class="panel"><h2>Завдання за виконавцями</h2><div class="bars" id="chResp" data-dim="resp"></div></article>
      <article class="panel"><h2>Завдання за розділами</h2><div class="bars" id="chSection" data-dim="section"></div></article>
      <article class="panel"><h2>Завдання за термінами</h2><div class="bars" id="chTerm" data-dim="term"></div></article>
    </section>

    <section class="panel results" id="results">
      <div class="results-bar">
        <h2 id="resCount">Завдання</h2>
        <div class="results-controls">
          <div class="seg" role="group" aria-label="Вигляд">
            <button type="button" data-view="table" class="seg-btn">☰ Таблиця</button>
            <button type="button" data-view="cards" class="seg-btn">▦ Картки</button>
          </div>
          <label class="inline">На сторінці
            <select id="pageSize">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="0">Усі</option>
            </select>
          </label>
        </div>
      </div>

      <div id="tableWrap" class="table-wrap"></div>
      <div id="cardsWrap" class="cards" hidden></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal-head">
        <div>
          <span class="num-badge" id="mNum"></span>
          <h3 id="mTitle"></h3>
        </div>
        <button class="icon-btn" id="mClose" type="button" aria-label="Закрити">✕</button>
      </div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="mPrev" type="button">← Попереднє</button>
        <button class="btn btn-outline" id="mCopy" type="button">⧉ Копіювати</button>
        <button class="btn btn-outline" id="mNext" type="button">Наступне →</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="print-report" id="printReport" hidden></div>

  <script src="data-fallback.js"></script>
  <script src="app.js"></script>
</body>
</html>
